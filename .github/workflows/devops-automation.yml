name: DevOps Automation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar:
    name: Validar estructura y construir imagen
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Verificar archivos obligatorios
        run: |
          for f in src/index.html src/styles.css Dockerfile docker-compose.yml .gitignore .env.example README.md; do
            test -f "$f" && echo "OK: $f" || { echo "FALTA: $f"; exit 1; }
          done

      - name: Verificar que no existe un archivo .env real
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "El archivo .env no debe estar versionado"; exit 1
          fi
          echo "OK: .env no está versionado"

      - name: Validar docker-compose.yml
        run: docker compose config -q

      - name: Construir imagen Docker
        run: docker build -t reserva-horas-medicas:ci .

      - name: Probar el servicio en el puerto 8080
        run: |
          docker run -d --name prueba -p 8080:80 reserva-horas-medicas:ci
          sleep 5
          curl -fsS http://localhost:8080 | grep -q "Reserva de hora médica"
          echo "Servicio responde correctamente"
          docker logs prueba
          docker rm -f prueba
