services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: reserva-horas-medicas:1.0.0
    container_name: reserva-horas-web
    ports:
      # Puerto del equipo : puerto del contenedor (configurable desde .env)
      - "${HOST_PORT:-8080}:80"
    environment:
      - TZ=${TZ:-America/Santiago}
    restart: unless-stopped
